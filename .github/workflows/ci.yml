name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      # A failure on one Node.js line says nothing about the others, so each runs to the end.
      fail-fast: false
      matrix:
        # The floor in package.json engines, then every newer LTS line that still gets
        # security fixes. test/node-versions.test.ts fails if the lowest entry is not the floor.
        node: [22, 24, 26]
    steps:
      # No token left on disk: nothing in this job pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci fails when the lockfile no longer matches package.json. No package here
      # needs an install script, so none runs.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

  # The check for branch protection to require. It passes only when every Node.js line
  # passed, so the matrix can change without editing the protection rule.
  tests-passed:
    name: Tests passed
    needs: test
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test.result }}
